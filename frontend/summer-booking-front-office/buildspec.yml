version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      # Exact Node version of the project, read from .nvmrc (same as local development).
      - n "$(cat frontend/summer-booking-front-office/.nvmrc)"
      - npm ci --prefix frontend/summer-booking-front-office
  pre_build:
    commands:
      # Angular build configuration of the environment: dev (mock API on) or production.
      - test "$BUILD_CONFIGURATION" = "dev" -o "$BUILD_CONFIGURATION" = "production"
      - test -n "$S3_BUCKET"
      - test -n "$CLOUDFRONT_DISTRIBUTION_ID"
  build:
    commands:
      # Lint, types of the tests and unit tests first: when one fails nothing is built or published.
      - npm run verify --prefix frontend/summer-booking-front-office
      - npm run build --prefix frontend/summer-booking-front-office -- --configuration "$BUILD_CONFIGURATION"
  post_build:
    commands:
      # CodeBuild runs post_build even when the build fails: never publish a broken or partial build.
      - test "$CODEBUILD_BUILD_SUCCEEDING" = "1"
      - DIST=frontend/summer-booking-front-office/dist/summer-booking-front-office/browser
      # Bundles with a hash in the file name: they never change, cached for one year.
      - aws s3 cp "$DIST" "s3://$S3_BUCKET" --recursive --exclude "*" --include "main-*.js" --include "chunk-*.js" --include "polyfills-*.js" --include "styles-*.css" --cache-control "public, max-age=31536000, immutable"
      # Images and fonts keep the same name when replaced: cached for one day.
      - aws s3 cp "$DIST/assets" "s3://$S3_BUCKET/assets" --recursive --exclude "i18n/*" --cache-control "public, max-age=86400"
      # index.html, translations, service worker and the other files: revalidated on every visit. Uploaded last,
      # so the new index.html only goes online once the bundles it references are in place.
      - aws s3 cp "$DIST" "s3://$S3_BUCKET" --recursive --exclude "main-*.js" --exclude "chunk-*.js" --exclude "polyfills-*.js" --exclude "styles-*.css" --exclude "assets/*" --include "assets/i18n/*" --cache-control "no-cache"
      # Removes the files of previous builds, but not their bundles: a tab still open on the old version
      # asks for them when it opens a page it has not loaded yet.
      - aws s3 sync "$DIST" "s3://$S3_BUCKET" --delete --exclude "main-*.js" --exclude "chunk-*.js" --exclude "polyfills-*.js" --exclude "styles-*.css"
      # Bundles of previous builds go after 24 hours: by then every open tab has been reloaded.
      - CUTOFF=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%S)
      - aws s3api list-objects-v2 --bucket "$S3_BUCKET" --query "Contents[].[LastModified,Key]" --output text | awk -v cutoff="$CUTOFF" '$1 < cutoff && $2 ~ /^(main|chunk|polyfills|styles)-[^\/]+\.(js|css)$/ { print $2 }' | while read -r key; do [ -e "$DIST/$key" ] || aws s3 rm "s3://$S3_BUCKET/$key"; done
      - aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"

artifacts:
  files:
    - '**/*'
  base-directory: frontend/summer-booking-front-office/dist/summer-booking-front-office/browser
