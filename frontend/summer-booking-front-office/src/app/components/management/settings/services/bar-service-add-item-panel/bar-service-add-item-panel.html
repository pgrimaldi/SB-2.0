<app-side-panel
  [title]="'management.settings.services.bar_services.add_title' | translate"
  [texts]="'management.settings.services.form' | translate"
  [pathIcon]="pathIcon()"
  [isLoading]="isSaving()"
  [isSaveDisabled]="isSaveDisabled()"
  [(open)]="open"
  (closeRequest)="leave()"
  (save)="save()"
>
  <app-tab-group [tabs]="tabs()" [(selectedIndex)]="selectedTab">
    @if (selectedTab() === PanelTab.GeneralInfo) {
      <app-service-general-info-tab
        [attr.inert]="isFetching() ? '' : null"
        [form]="draftForm"
        [mainLanguage]="mainLanguage()"
        [imagePreviewUrl]="imagePreviewUrl()"
        (iconChosen)="chooseIcon($event)"
        (imageChosen)="chooseImage($event)"
      />
    } @else if (selectedTab() === PanelTab.Prices) {
      <app-service-prices-tab
        [attr.inert]="isFetching() ? '' : null"
        [form]="draftForm"
        [periods]="periods()"
      />
    } @else if (selectedTab() === PanelTab.Bookings) {
      <app-service-bookings-tab
        [attr.inert]="isFetching() ? '' : null"
        [form]="draftForm.bookingOptions"
      />
    }
    @if (errorMessage(); as errorMessage) {
      <p class="bar__service__add__item__panel__error">{{ errorMessage }}</p>
    }
  </app-tab-group>
</app-side-panel>
