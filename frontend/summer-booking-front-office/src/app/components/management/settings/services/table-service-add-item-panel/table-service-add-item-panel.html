<app-side-panel
  [title]="'management.settings.services.table_booking.add_title' | translate"
  [texts]="'management.settings.services.form' | translate"
  [pathIcon]="pathIcon()"
  [isSaveDisabled]="isSaveDisabled()"
  [(open)]="open"
  (closeRequest)="leave()"
>
  <app-tab-group [tabs]="tabs()" [(selectedIndex)]="selectedTab">
    @if (selectedTab() === PanelTab.GeneralInfo) {
      <app-table-service-general-info-tab [form]="draftForm" [mainLanguage]="mainLanguage()" />
    }
  </app-tab-group>
</app-side-panel>
