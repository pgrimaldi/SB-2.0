<app-services-translations [form]="form().translations" [mainLanguage]="mainLanguage()" />

<app-filled-select
  [label]="'management.settings.services.form.category' | translate"
  [placeholder]="'management.settings.services.form.choose' | translate"
  [options]="categories()"
  [formField]="form().category"
/>

<app-services-images
  [icons]="icons"
  [chosenIcon]="form().icon().value()"
  [imagePreviewUrl]="imagePreviewUrl()"
  [isReadonly]="isReadonly()"
  (iconChosen)="iconChosen.emit($event)"
  (imageChosen)="imageChosen.emit($event)"
/>

<app-services-highlighted [form]="form().isHighlighted" />
