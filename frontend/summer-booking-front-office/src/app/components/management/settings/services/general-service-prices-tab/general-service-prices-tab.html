<app-services-price-vat
  [price]="form().price"
  [vatRate]="form().vatRate"
  [isPriceMandatory]="true"
/>

<app-services-period-prices
  [isPeriodPricingEnabled]="form().isPeriodPricingEnabled"
  [periodPrices]="form().periodPrices"
  [periods]="periods()"
/>

<app-services-limits [form]="form().idSectors" [sectorsVersion]="sectorsVersion()" />

<app-toggle
  [formField]="form().isOnlinePurchaseEnabled"
  [error]="validationText.text(form().isOnlinePurchaseEnabled)"
>
  {{ 'management.settings.services.form.prices.online_purchase' | translate }}
</app-toggle>
