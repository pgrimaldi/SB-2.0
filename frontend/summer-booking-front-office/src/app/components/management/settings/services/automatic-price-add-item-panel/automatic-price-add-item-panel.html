<app-side-panel
  [title]="'management.settings.services.automatic_prices.add_title' | translate"
  [texts]="'management.settings.services.form' | translate"
  [pathIcon]="pathIcon()"
  [isLoading]="isSaving()"
  [isSaveDisabled]="isSaveDisabled()"
  [(open)]="open"
  (closeRequest)="leave()"
  (save)="save()"
>
  <app-tab-group [tabs]="tabs()" [(selectedIndex)]="selectedTab">
    @if (selectedTab() === PanelTab.GeneralInfo) {
      <app-automatic-price-general-info-tab
        [attr.inert]="isFetching() ? '' : null"
        [form]="draftForm"
        [mainLanguage]="mainLanguage()"
        [imagePreviewUrl]="imagePreviewUrl()"
        (iconChosen)="chooseIcon($event)"
        (imageChosen)="chooseImage($event)"
      />
    } @else if (selectedTab() === PanelTab.PricesValidity) {
      <app-automatic-price-prices-validity-tab
        [attr.inert]="isFetching() ? '' : null"
        [form]="draftForm"
        [services]="services()"
      />
    }
    @if (errorMessage(); as errorMessage) {
      <p class="automatic__price__add__item__panel__error">{{ errorMessage }}</p>
    }
  </app-tab-group>
</app-side-panel>
