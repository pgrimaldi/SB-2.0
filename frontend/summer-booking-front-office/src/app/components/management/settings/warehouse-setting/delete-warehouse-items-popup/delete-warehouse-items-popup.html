@let name = itemName();
<app-confirm-popup
  [title]="
    (name
      ? 'management.settings.warehouse.delete.one.title'
      : 'management.settings.warehouse.delete.many.title'
    ) | translate
  "
  [text]="
    name
      ? ('management.settings.warehouse.delete.one.text' | translate: { name })
      : ('management.settings.warehouse.delete.many.text' | translate: { count: idItems().length })
  "
  [texts]="'management.settings.warehouse.delete' | translate"
  [danger]="true"
  [isLoading]="isLoading()"
  [error]="errorMessage()"
  [(open)]="open"
  (confirmed)="deleteItems()"
/>
