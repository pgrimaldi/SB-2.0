<aside class="settings__menu">
  <nav
    class="settings__menu__links"
  >
    @for (link of links(); track link.route) {
      <a
        class="settings__menu__item"
        routerLinkActive="settings__menu__item__active"
        [routerLink]="link.route"
      >
        <span [appI18nText]="link.label"></span>
      </a>
    }
  </nav>
</aside>
