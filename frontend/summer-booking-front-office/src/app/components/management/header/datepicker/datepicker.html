<!-- Dates are not typed by hand: a click (or Enter) on a date opens its calendar. -->
<div class="datepicker">
  <img class="datepicker__icon" src="/assets/images/calendar.svg" width="22" height="22" alt="" />

  <button
    class="datepicker__arrow"
    type="button"
    [attr.aria-label]="'management.header.datepicker.start.previous' | translate"
    (click)="moveStart(-1)"
  >
    <img src="/assets/images/arrow-left.svg" width="4" height="9" alt="" />
  </button>
  <input
    class="datepicker__input"
    [attr.aria-label]="'management.header.datepicker.start.label' | translate"
    readonly
    [matDatepicker]="startCalendar"
    [value]="start()"
    (click)="startCalendar.open()"
    (keydown.enter)="startCalendar.open()"
    (dateChange)="setStart($event.value)"
  />
  <button
    class="datepicker__arrow"
    type="button"
    [attr.aria-label]="'management.header.datepicker.start.next' | translate"
    (click)="moveStart(1)"
  >
    <img src="/assets/images/arrow-right.svg" width="4" height="9" alt="" />
  </button>

  <span class="datepicker__divider" aria-hidden="true"></span>

  <button
    class="datepicker__arrow"
    type="button"
    [attr.aria-label]="'management.header.datepicker.end.previous' | translate"
    (click)="moveEnd(-1)"
  >
    <img src="/assets/images/arrow-left.svg" width="4" height="9" alt="" />
  </button>
  <input
    class="datepicker__input"
    [attr.aria-label]="'management.header.datepicker.end.label' | translate"
    readonly
    [matDatepicker]="endCalendar"
    [value]="end()"
    (click)="endCalendar.open()"
    (keydown.enter)="endCalendar.open()"
    (dateChange)="setEnd($event.value)"
  />
  <button
    class="datepicker__arrow"
    type="button"
    [attr.aria-label]="'management.header.datepicker.end.next' | translate"
    (click)="moveEnd(1)"
  >
    <img src="/assets/images/arrow-right.svg" width="4" height="9" alt="" />
  </button>
</div>

<!-- Calendars open in an overlay; kept outside the pill so they take no place in its layout. -->
<mat-datepicker #startCalendar panelClass="datepicker__calendar" [dateClass]="rangeClass" />
<mat-datepicker #endCalendar panelClass="datepicker__calendar" [dateClass]="rangeClass" />
