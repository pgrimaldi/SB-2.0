<header class="management__header">
  <img
    class="management__header__logo"
    src="/assets/images/hub/logo-text-blue.webp"
    width="944"
    height="342"
    [alt]="'management.header.logo.alt' | translate"
  />

  <div class="management__header__filters">
    <app-datepicker
      [pathIcon]="[
        '/assets/images/calendar.svg',
        '/assets/images/arrow-left.svg',
        '/assets/images/arrow-right.svg',
      ]"
      [texts]="'management.header.datepicker' | translate"
      [(start)]="filters.startDate"
      [(end)]="filters.endDate"
    />

    <!-- "Oggi" while the dates are today; otherwise "Non oggi", which brings both dates back to today. -->
    <button
      class="management__header__today"
      type="button"
      [class.management__header__today__other]="!showsToday()"
      [disabled]="showsToday()"
      (click)="resetToToday()"
    >
      @if (showsToday()) {
        <img src="/assets/images/today.svg" width="19" height="20" alt="" />
        <span appI18nText="management.header.today.today"></span>
      } @else {
        <img src="/assets/images/not-today.svg" width="18" height="20" alt="" />
        <span appI18nText="management.header.today.other"></span>
      }
    </button>

    <app-select
      [accessibleLabel]="'management.header.period.label' | translate"
      [options]="periods()"
      [(selected)]="filters.period"
    />

    <!-- Not wired for now: typing does not filter anything. -->
    <app-search-field
      [placeholder]="'management.header.search.placeholder' | translate"
      [texts]="'field.search' | translate"
      [pathIcon]="['/assets/images/search.svg', '/assets/images/clear.svg']"
    />
  </div>

  <div class="management__header__actions">
    <app-icon-button
      [label]="'management.header.actions.configuration' | translate"
      [pathIcon]="['/assets/images/configuration.svg']"
    />
    <app-icon-button
      [label]="'management.header.actions.settings' | translate"
      [pathIcon]="['/assets/images/settings.svg']"
    />
    <app-icon-button
      [label]="'management.header.actions.assistant' | translate"
      [pathIcon]="['/assets/images/assistant.svg']"
    />
    <app-icon-button
      [label]="'management.header.actions.notifications' | translate"
      [pathIcon]="['/assets/images/notifications.svg']"
    />
    <app-icon-button [label]="'management.header.actions.account' | translate">
      {{ initial() }}
    </app-icon-button>
  </div>
</header>
