@if (hasBar()) {
  <div class="table__bar">
    @if (hasIconActions()) {
      <div class="table__bar__icons"><ng-content select="[appTableIconAction]" /></div>
    }
    @if (searchable()) {
      <app-search-field
        class="table__bar__search"
        [placeholder]="texts()?.search?.placeholder"
        [texts]="texts()?.search"
        [matIcon]="matIcon()"
        [pathIcon]="pathIcon()"
        (search)="search.set($event)"
      />
    }
    @if (hasTextActions()) {
      <div class="table__bar__buttons"><ng-content select="[appTableTextAction]" /></div>
    }
  </div>
}

<div class="table">
  <table mat-table class="table__grid" [dataSource]="rows()">
    @for (column of columns(); track column.field) {
      <ng-container [matColumnDef]="column.field">
        <th
          *matHeaderCellDef
          mat-header-cell
          class="table__cell"
          [style.text-align]="column.align"
          [style.width.%]="column.width"
        >
          {{ column.header }}
        </th>
        <td *matCellDef="let row" mat-cell class="table__cell" [style.text-align]="column.align">
          {{ row[column.field] }}
        </td>
      </ng-container>
    }

    <tr *matHeaderRowDef="fields()" mat-header-row class="table__header"></tr>
    <tr *matRowDef="let row; columns: fields()" mat-row class="table__row"></tr>
  </table>
</div>

@if (paginated()) {
  <mat-paginator
    class="table__paginator"
    [length]="total()"
    [pageSize]="pageSize()"
    [pageSizeOptions]="pageSizeOptions()"
    [pageIndex]="page() - 1"
    [selectConfig]="selectConfig"
    (page)="changePage($event)"
  />
}
