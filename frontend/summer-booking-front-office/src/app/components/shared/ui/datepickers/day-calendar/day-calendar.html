<div class="day__calendar" [attr.inert]="isLocked() ? '' : null">
  <mat-calendar
    class="day__calendar__calendar"
    [headerComponent]="Header"
    [dateFilter]="dateFilter()"
    [dateClass]="dateClass()"
    (selectedChange)="pick($event)"
  />
  @if (texts()?.hint; as hint) {
    <p class="day__calendar__hint">{{ hint }}</p>
  }
</div>
