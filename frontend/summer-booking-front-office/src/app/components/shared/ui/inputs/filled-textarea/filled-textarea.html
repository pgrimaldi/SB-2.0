<label class="filled__textarea__label" [for]="id"
  >{{ label() }}
  @if (isMandatory()) {
    <span class="filled__textarea__mandatory" aria-hidden="true">*</span>
  }
</label>
<mat-form-field
  class="filled__textarea__control"
  appearance="fill"
  subscriptSizing="dynamic"
  [class.filled__textarea__invalid]="!!error()"
  [class.filled__textarea__locked]="readonly() || disabled()"
>
  <textarea
    #field
    matInput
    [required]="isMandatory()"
    [readonly]="readonly()"
    [disabled]="disabled()"
    [id]="id"
    [rows]="rows()"
    [value]="value() ?? ''"
    [placeholder]="placeholder() ?? ''"
    [attr.maxlength]="maxLength() ?? null"
    [name]="name() ?? ''"
    [errorStateMatcher]="errorMatcher"
    [attr.aria-describedby]="error() ? id + '-error' : null"
    (input)="value.set(field.value || null)"
    (blur)="touch.emit()"
  ></textarea>
</mat-form-field>
@if (error(); as error) {
  <p class="filled__textarea__error" [id]="id + '-error'">{{ error }}</p>
}
