@if (label()) {
  <label class="filled__number__field__label" [for]="id"
    >{{ label() }}
    @if (isMandatory()) {
      <span class="filled__number__field__mandatory">*</span>
    }
  </label>
}
<mat-form-field
  class="filled__number__field__control"
  appearance="fill"
  subscriptSizing="dynamic"
  [class.filled__number__field__invalid]="!!error()"
  [class.filled__number__field__locked]="readonly() || disabled()"
>
  <!-- One @if around the span alone, or Material would not place it before the number. -->
  @if (isCurrency() && icons().list[0]; as icon) {
    <span matTextPrefix class="filled__number__field__currency">
      @if (icons().material) {
        <mat-icon>{{ icon }}</mat-icon>
      } @else {
        <img [src]="icon" width="14" height="14" alt="" />
      }
    </span>
  }
  <!-- A text field, not type="number": that one accepts "e", signs and more than one separator. -->
  <input
    #field
    matInput
    [required]="isMandatory()"
    [readonly]="readonly()"
    [disabled]="disabled()"
    [type]="inputType()"
    [attr.autocomplete]="autocomplete() ?? 'off'"
    [attr.inputmode]="isDecimal() ? 'decimal' : 'numeric'"
    [id]="id"
    [value]="text()"
    [name]="name() ?? ''"
    [errorStateMatcher]="errorMatcher"
    (input)="changeValue(field)"
    (blur)="touch.emit()"
  />
  @if (isMasked()) {
    <button
      matSuffix
      class="filled__number__field__toggle"
      type="button"
      (click)="toggleVisible()"
    >
      @if (icons().list[visible() ? 1 : 2]; as icon) {
        @if (icons().material) {
          <mat-icon>{{ icon }}</mat-icon>
        } @else {
          <img [src]="icon" width="18" height="18" alt="" />
        }
      }
    </button>
  }
</mat-form-field>
@if (error(); as error) {
  <p class="filled__number__field__error">{{ error }}</p>
}
