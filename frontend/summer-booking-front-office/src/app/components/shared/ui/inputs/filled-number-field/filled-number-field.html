<label class="filled__number__field__label" [for]="id"
  >{{ label() }}
  @if (isMandatory()) {
    <span class="filled__number__field__mandatory" aria-hidden="true">*</span>
  }
</label>
<mat-form-field
  class="filled__number__field__control"
  appearance="fill"
  subscriptSizing="dynamic"
  [class.filled__number__field__invalid]="!!error()"
  [class.filled__number__field__locked]="readonly() || disabled()"
>
  <!-- One @if around the span alone, or Material would not place it before the number. -->
  @if (currency() && icons().list[0]; as icon) {
    <span matTextPrefix class="filled__number__field__currency">
      @if (icons().material) {
        <mat-icon aria-hidden="true">{{ icon }}</mat-icon>
      } @else {
        <img [src]="icon" width="14" height="14" alt="" />
      }
    </span>
  }
  <!-- A text field, not type="number": that one accepts "e", signs and more than one separator. -->
  <input
    #field
    matInput
    [required]="isMandatory()"
    [readonly]="readonly()"
    [disabled]="disabled()"
    type="text"
    autocomplete="off"
    [attr.inputmode]="decimal() ? 'decimal' : 'numeric'"
    [id]="id"
    [value]="text()"
    [attr.name]="name() ?? null"
    [errorStateMatcher]="errorMatcher"
    [attr.aria-describedby]="error() ? id + '-error' : null"
    (input)="changeValue(field)"
    (blur)="touch.emit()"
  />
</mat-form-field>
@if (error(); as error) {
  <p class="filled__number__field__error" [id]="id + '-error'">{{ error }}</p>
}
