<label class="password__field__label" [for]="id">{{ label() }}</label>
<mat-form-field appearance="outline" subscriptSizing="dynamic">
  <input
    #field
    matInput
    [id]="id"
    [value]="value()"
    [type]="visible() ? 'text' : 'password'"
    [attr.name]="name() ?? null"
    [attr.autocomplete]="autocomplete() ?? null"
    (input)="value.set(field.value)"
  />
  <button
    matSuffix
    class="password__field__toggle"
    type="button"
    [attr.aria-label]="texts()?.show ?? null"
    [attr.aria-pressed]="visible()"
    [attr.aria-controls]="id"
    (click)="toggle()"
  >
    <!-- First icon while the password is shown, second while it is hidden. -->
    @if (icons().list[visible() ? 0 : 1]; as icon) {
      @if (icons().material) {
        <mat-icon aria-hidden="true">{{ icon }}</mat-icon>
      } @else {
        <img [src]="icon" width="24" height="24" alt="" />
      }
    }
  </button>
</mat-form-field>
