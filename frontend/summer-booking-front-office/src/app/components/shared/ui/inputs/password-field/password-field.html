<label class="password__field__label" [for]="id"
  >{{ label() }}
  @if (isMandatory()) {
    <span class="password__field__mandatory" aria-hidden="true">*</span>
  }
</label>
<mat-form-field appearance="outline" subscriptSizing="dynamic">
  <input
    #field
    matInput
    [required]="isMandatory()"
    [id]="id"
    [value]="value() ?? ''"
    [type]="visible() ? 'text' : 'password'"
    [name]="name() ?? ''"
    [attr.autocomplete]="autocomplete() ?? null"
    [errorStateMatcher]="errorMatcher"
    [attr.aria-describedby]="error() ? id + '-error' : null"
    (input)="value.set(field.value || null)"
    (blur)="touch.emit()"
  />
  <button
    matSuffix
    class="password__field__toggle"
    type="button"
    [attr.aria-label]="texts()?.show ?? null"
    [attr.aria-pressed]="visible()"
    [attr.aria-controls]="id"
    (click)="toggle()"
  >
    @if (icons().list[visible() ? 0 : 1]; as icon) {
      @if (icons().material) {
        <mat-icon aria-hidden="true">{{ icon }}</mat-icon>
      } @else {
        <img [src]="icon" width="24" height="24" alt="" />
      }
    }
  </button>
</mat-form-field>
@if (error(); as error) {
  <p class="password__field__error" [id]="id + '-error'">{{ error }}</p>
}
