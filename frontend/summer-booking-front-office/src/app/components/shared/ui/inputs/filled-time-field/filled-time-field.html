@if (label()) {
  <label class="filled__time__field__label" [for]="id"
    >{{ label() }}
    @if (isMandatory()) {
      <span class="filled__time__field__mandatory">*</span>
    }
  </label>
}
<mat-form-field
  class="filled__time__field__control"
  appearance="fill"
  subscriptSizing="dynamic"
  [class.filled__time__field__invalid]="!!error()"
  [class.filled__time__field__locked]="isLocked()"
>
  @if (icons().list[0]; as icon) {
    <span matIconPrefix class="filled__time__field__icon">
      @if (icons().material) {
        <mat-icon>{{ icon }}</mat-icon>
      } @else {
        <img [src]="icon" width="16" height="16" alt="" />
      }
    </span>
  }
  <input
    matInput
    autocomplete="off"
    [required]="isMandatory()"
    [readonly]="readonly()"
    [disabled]="disabled()"
    [id]="id"
    [name]="name() ?? ''"
    [matTimepicker]="picker"
    [matTimepickerOpenOnClick]="!isLocked()"
    [value]="time()"
    [errorStateMatcher]="errorMatcher"
    (valueChange)="choose($event)"
    (blur)="touch.emit()"
  />
</mat-form-field>
<mat-timepicker #picker />
@if (error(); as error) {
  <p class="filled__time__field__error">{{ error }}</p>
}
