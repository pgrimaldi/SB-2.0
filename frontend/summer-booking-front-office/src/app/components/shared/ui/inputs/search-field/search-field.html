<mat-form-field class="search__field" appearance="fill" subscriptSizing="dynamic">
  <input
    #field
    matInput
    type="search"
    [placeholder]="placeholder() ?? ''"
    [value]="text()"
    (input)="text.set(field.value)"
  />
  @if (text()) {
    <button
      matSuffix
      mat-icon-button
      class="search__field__button"
      type="button"
      (click)="clear(field)"
    >
      @if (icons().list[1]; as icon) {
        @if (icons().material) {
          <mat-icon>{{ icon }}</mat-icon>
        } @else {
          <img [src]="icon" width="18" height="18" alt="" />
        }
      }
    </button>
  } @else {
    <!-- It starts no search for now. -->
    <button
      matSuffix
      mat-icon-button
      class="search__field__button"
      type="button"
    >
      @if (icons().list[0]; as icon) {
        @if (icons().material) {
          <mat-icon>{{ icon }}</mat-icon>
        } @else {
          <img [src]="icon" width="18" height="18" alt="" />
        }
      }
    </button>
  }
</mat-form-field>
