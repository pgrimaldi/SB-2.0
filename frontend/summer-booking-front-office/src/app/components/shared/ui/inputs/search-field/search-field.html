<mat-form-field class="search__field" appearance="fill" subscriptSizing="dynamic">
  <input
    #field
    matInput
    type="search"
    [placeholder]="placeholder() | translate"
    [attr.aria-label]="placeholder() | translate"
    [value]="text()"
    (input)="text.set(field.value)"
  />
  <!-- With some text the magnifier becomes an X that empties the field. -->
  @if (text()) {
    <button
      matSuffix
      mat-icon-button
      class="search__field__button"
      type="button"
      [attr.aria-label]="'field.search.clear' | translate"
      (click)="clear(field)"
    >
      <img src="/assets/images/clear.svg" width="18" height="18" alt="" />
    </button>
  } @else {
    <!-- Same button as before; it starts no search for now. -->
    <button
      matSuffix
      mat-icon-button
      class="search__field__button"
      type="button"
      [attr.aria-label]="'field.search.submit' | translate"
    >
      <img src="/assets/images/search.svg" width="18" height="18" alt="" />
    </button>
  }
</mat-form-field>
