<label class="text__field__label" [for]="id"
  >{{ label() }}
  @if (isMandatory()) {
    <span class="text__field__mandatory" aria-hidden="true">*</span>
  }
</label>
<mat-form-field appearance="outline" subscriptSizing="dynamic">
  <input
    #field
    matInput
    [required]="isMandatory()"
    [id]="id"
    [value]="value()"
    [type]="type()"
    [attr.name]="name() ?? null"
    [attr.autocomplete]="autocomplete() ?? null"
    (input)="value.set(field.value)"
  />
</mat-form-field>
