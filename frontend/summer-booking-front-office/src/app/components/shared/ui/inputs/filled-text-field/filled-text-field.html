@if (label()) {
  <label class="filled__text__field__label" [for]="id"
    >{{ label() }}
    @if (isMandatory()) {
      <span class="filled__text__field__mandatory" aria-hidden="true">*</span>
    }
  </label>
}
<mat-form-field
  class="filled__text__field__control"
  appearance="fill"
  subscriptSizing="dynamic"
  [class.filled__text__field__invalid]="!!error()"
  [class.filled__text__field__locked]="readonly() || disabled()"
>
  <input
    #field
    matInput
    [required]="isMandatory()"
    [readonly]="readonly()"
    [disabled]="disabled()"
    [type]="inputType()"
    [id]="id"
    [value]="value() ?? ''"
    [placeholder]="placeholder() ?? ''"
    [attr.maxlength]="maxLength() ?? null"
    [name]="name() ?? ''"
    [attr.autocomplete]="autocomplete() ?? null"
    [attr.aria-labelledby]="labelledBy() ?? null"
    [errorStateMatcher]="errorMatcher"
    [attr.aria-describedby]="error() ? id + '-error' : null"
    (input)="value.set(field.value || null)"
    (blur)="touch.emit()"
  />
  @if (isPasswordField()) {
    <button
      matSuffix
      class="filled__text__field__toggle"
      type="button"
      [attr.aria-label]="texts()?.show ?? null"
      [attr.aria-pressed]="visible()"
      [attr.aria-controls]="id"
      (click)="toggleVisible()"
    >
      @if (icons().list[visible() ? 0 : 1]; as icon) {
        @if (icons().material) {
          <mat-icon aria-hidden="true">{{ icon }}</mat-icon>
        } @else {
          <img [src]="icon" width="18" height="18" alt="" />
        }
      }
    </button>
  }
</mat-form-field>
@if (error(); as error) {
  <p class="filled__text__field__error" [id]="id + '-error'">{{ error }}</p>
}
