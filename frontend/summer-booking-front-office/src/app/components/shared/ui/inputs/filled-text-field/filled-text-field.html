<label class="filled__text__field__label" [for]="id">{{ label() }}</label>
<mat-form-field class="filled__text__field__control" appearance="fill" subscriptSizing="dynamic">
  <input
    #field
    matInput
    type="text"
    [id]="id"
    [value]="value()"
    [attr.maxlength]="maxLength() ?? null"
    [attr.name]="name() ?? null"
    (input)="value.set(field.value)"
  />
</mat-form-field>
