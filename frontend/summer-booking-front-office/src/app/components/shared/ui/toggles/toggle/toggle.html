<mat-slide-toggle
  class="toggle"
  hideIcon
  [name]="name() ?? null"
  [checked]="checked()"
  [disabled]="disabled()"
  [aria-label]="accessibleLabel() ?? null"
  [aria-describedby]="error() ? id + '-error' : ''"
  (change)="checked.set($event.checked)"
  ><ng-content
/></mat-slide-toggle>
@if (error(); as error) {
  <p class="toggle__error" [id]="id + '-error'">{{ error }}</p>
}
