<mat-select
  class="tab__nav__select"
  panelClass="select__panel"
  hideSingleSelectionIndicator
  [value]="chosenPath()"
  (valueChange)="choose($event)"
>
  @for (tab of tabs(); track tab.path) {
    <mat-option [value]="tab.path">{{ tab.label }}</mat-option>
  }
</mat-select>
<nav class="tab__nav__bar" mat-tab-nav-bar [tabPanel]="panel">
  @for (tab of tabs(); track tab.path) {
    <a
      class="tab__nav__link"
      mat-tab-link
      [style.flex]="tab.widthPercent === undefined ? null : '0 0 ' + tab.widthPercent + '%'"
      [routerLink]="tab.path"
      routerLinkActive
      #link="routerLinkActive"
      [active]="link.isActive"
      (isActiveChange)="setActive(tab.path, $event)"
    >
      {{ tab.label }}
    </a>
  }
</nav>
<mat-tab-nav-panel #panel class="tab__nav__panel">
  <router-outlet />
</mat-tab-nav-panel>
