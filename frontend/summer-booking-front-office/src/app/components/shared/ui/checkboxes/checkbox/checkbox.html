<mat-checkbox
  class="checkbox"
  [name]="name() ?? null"
  [checked]="checked()"
  [disabled]="disabled()"
  [labelPosition]="hasLabelBefore() ? 'before' : 'after'"
  (change)="checked.set($event.checked)"
  ><ng-content
/></mat-checkbox>
@if (error(); as error) {
  <p class="checkbox__error">{{ error }}</p>
}
