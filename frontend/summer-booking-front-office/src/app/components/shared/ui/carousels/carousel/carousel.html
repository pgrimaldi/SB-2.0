<div
  class="carousel"
>
  <div
    #viewport
    class="carousel__viewport"
    [class.carousel__viewport__dragging]="dragging()"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp()"
    (pointercancel)="onPointerUp()"
  >
    <ul class="carousel__track" [style.transform]="transform()">
      @for (slide of slides(); track $index) {
        <li
          class="carousel__slide"
          [attr.inert]="isVisible($index) ? null : ''"
        >
          <!-- The slide role lives on the inner element: a role on the <li> would break the list. -->
          <div
            class="carousel__slide__content"
          >
            <ng-container [ngTemplateOutlet]="slide" />
          </div>
        </li>
      }
    </ul>

    @if (index() > 0) {
      <button
        class="carousel__arrow carousel__arrow__previous"
        type="button"
        (click)="previous()"
      >
        @if (icons().list[0]; as icon) {
          @if (icons().material) {
            <mat-icon>{{ icon }}</mat-icon>
          } @else {
            <img [src]="icon" width="12" height="16" alt="" />
          }
        }
      </button>
    }
    @if (index() < maxIndex()) {
      <button
        class="carousel__arrow carousel__arrow__next"
        type="button"
        (click)="next()"
      >
        @if (icons().list[1]; as icon) {
          @if (icons().material) {
            <mat-icon>{{ icon }}</mat-icon>
          } @else {
            <img [src]="icon" width="12" height="16" alt="" />
          }
        }
      </button>
    }
  </div>

  @if (maxIndex() > 0) {
    <div class="carousel__dots">
      @for (position of positions(); track position) {
        <button
          class="carousel__dot"
          type="button"
          [class.carousel__dot__active]="position === index()"
          (click)="goTo(position)"
        ></button>
      }
    </div>
  }
</div>
