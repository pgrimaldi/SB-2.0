<div
  class="carousel"
  role="region"
  aria-roledescription="carousel"
  [attr.aria-label]="accessibleLabel()"
>
  <div
    #viewport
    class="carousel__viewport"
    [class.carousel__viewport__dragging]="dragging()"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp()"
    (pointercancel)="onPointerUp()"
  >
    <ul class="carousel__track" [style.transform]="transform()">
      @for (slide of slides(); track $index) {
        <li
          class="carousel__slide"
          [attr.aria-hidden]="isVisible($index) ? null : 'true'"
          [attr.inert]="isVisible($index) ? null : ''"
        >
          <!-- The slide role lives on the inner element: a role on the <li> would break the list. -->
          <div
            class="carousel__slide__content"
            role="group"
            aria-roledescription="slide"
            [attr.aria-label]="
              'carousel.slide' | translate: { index: $index + 1, total: slides().length }
            "
          >
            <ng-container [ngTemplateOutlet]="slide" />
          </div>
        </li>
      }
    </ul>

    @if (index() > 0) {
      <button
        class="carousel__arrow carousel__arrow__previous"
        type="button"
        [attr.aria-label]="'carousel.previous' | translate"
        (click)="previous()"
      >
        <svg viewBox="0 0 12 16" aria-hidden="true"><path d="M9.5 1.5 3 8l6.5 6.5" /></svg>
      </button>
    }
    @if (index() < maxIndex()) {
      <button
        class="carousel__arrow carousel__arrow__next"
        type="button"
        [attr.aria-label]="'carousel.next' | translate"
        (click)="next()"
      >
        <svg viewBox="0 0 12 16" aria-hidden="true"><path d="M2.5 1.5 9 8l-6.5 6.5" /></svg>
      </button>
    }
  </div>

  @if (maxIndex() > 0) {
    <div class="carousel__dots">
      @for (position of positions(); track position) {
        <button
          class="carousel__dot"
          type="button"
          [class.carousel__dot__active]="position === index()"
          [attr.aria-current]="position === index() ? 'true' : null"
          [attr.aria-label]="'carousel.position' | translate: { position: position + 1 }"
          (click)="goTo(position)"
        ></button>
      }
    </div>
  }
</div>
