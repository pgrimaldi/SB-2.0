<mat-select
  class="select__control"
  panelClass="select__panel"
  hideSingleSelectionIndicator
  [value]="selected()"
  (valueChange)="selected.set($event)"
>
  @for (option of options(); track option.value) {
    <mat-option [value]="option.value">{{ option.label }}</mat-option>
  }
</mat-select>
