@if (label()) {
  <label class="filled__multi__select__label">{{ label() }}</label>
}
<mat-form-field
  class="filled__multi__select__control"
  appearance="fill"
  subscriptSizing="dynamic"
  [class.filled__multi__select__locked]="disabled()"
>
  <mat-select
    panelClass="select__panel"
    multiple
    [disabled]="disabled()"
    [placeholder]="placeholder() ?? ''"
    [value]="value()"
    (valueChange)="value.set($event)"
  >
    @for (option of options(); track option.value) {
      <mat-option [value]="option.value">{{ option.label }}</mat-option>
    }
  </mat-select>
</mat-form-field>
