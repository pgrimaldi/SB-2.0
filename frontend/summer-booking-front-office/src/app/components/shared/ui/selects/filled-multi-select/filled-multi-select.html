@if (label()) {
  <label class="filled__multi__select__label">{{ label() }}</label>
}
<mat-form-field class="filled__multi__select__control" appearance="fill" subscriptSizing="dynamic">
  <mat-select
    panelClass="select__panel"
    multiple
    [placeholder]="placeholder() ?? ''"
    [value]="value()"
    (valueChange)="value.set($event)"
  >
    @for (option of options(); track option.value) {
      <mat-option [value]="option.value">{{ option.label }}</mat-option>
    }
  </mat-select>
</mat-form-field>
