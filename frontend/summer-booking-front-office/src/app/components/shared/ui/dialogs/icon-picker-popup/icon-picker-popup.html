<ng-template #content>
  <div class="icon__picker__popup">
    <h2 class="icon__picker__popup__title">{{ title() }}</h2>
    @if (text()) {
      <p class="icon__picker__popup__text">{{ text() }}</p>
    }
    <div class="icon__picker__popup__icons">
      @for (icon of choices(); track icon.value) {
        <button
          class="icon__picker__popup__icon"
          type="button"
          [class.icon__picker__popup__icon__chosen]="icon.value === chosenIcon()"
          (click)="choose(icon.value)"
        >
          <img [src]="icon.url" width="48" height="48" alt="" />
        </button>
      }
    </div>
  </div>
</ng-template>
