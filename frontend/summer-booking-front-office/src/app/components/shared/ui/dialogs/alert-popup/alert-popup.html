<ng-template #content>
  <div class="alert__popup">
    @if (icons().list[0]; as icon) {
      @if (icons().material) {
        <mat-icon class="alert__popup__icon" aria-hidden="true">{{ icon }}</mat-icon>
      } @else {
        <img class="alert__popup__icon" [src]="icon" width="48" height="48" alt="" />
      }
    }
    <h2 class="alert__popup__title" [id]="id + '-title'">{{ title() }}</h2>
    <p class="alert__popup__text" [id]="id + '-text'">{{ text() }}</p>
    <app-button (clicked)="close()">{{ texts()?.close }}</app-button>
  </div>
</ng-template>
