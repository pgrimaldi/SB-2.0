<ng-template #content>
  <div class="message__popup">
    <h2 class="message__popup__title" [id]="id + '-title'">{{ title() }}</h2>
    <p class="message__popup__text" [id]="id + '-text'">{{ text() }}</p>
    <app-button class="message__popup__close" (clicked)="close()">{{ texts()?.close }}</app-button>
  </div>
</ng-template>
