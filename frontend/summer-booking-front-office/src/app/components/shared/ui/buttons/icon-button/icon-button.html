<button
  mat-icon-button
  class="icon__button"
  type="button"
  [class.icon__button__text]="!icons().list[0]"
  [matTooltip]="label() ?? ''"
>
  @if (icons().list[0]; as icon) {
    @if (icons().material) {
      <mat-icon>{{ icon }}</mat-icon>
    } @else {
      <img [src]="icon" width="16" height="16" alt="" />
    }
  } @else {
    <ng-content />
  }
</button>
