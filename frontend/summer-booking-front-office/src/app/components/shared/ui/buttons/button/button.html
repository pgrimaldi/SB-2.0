<!-- While loading the label stays (it keeps the size and the name of the button) but cannot be seen:
the spinner is drawn over it. -->
<ng-template #label>
  <span class="button__label" [class.button__label__hidden]="isLoading()">
    @if (icons().list[0]; as icon) {
      @if (icons().material) {
        <mat-icon class="button__icon" aria-hidden="true">{{ icon }}</mat-icon>
      } @else {
        <img class="button__icon" [src]="icon" width="14" height="14" alt="" />
      }
    }
    <ng-content />
  </span>
  @if (isLoading()) {
    <mat-progress-spinner
      class="button__spinner"
      mode="indeterminate"
      aria-hidden="true"
      [diameter]="spinnerSize()"
    />
  }
</ng-template>

@if (appearance() !== ButtonAppearance.Secondary) {
  <button
    mat-flat-button
    [attr.aria-label]="accessibleLabel() ?? null"
    [attr.type]="isSubmitButton() ? 'submit' : 'button'"
    [disabled]="disabled()"
    [attr.aria-busy]="isLoading() || null"
    [attr.aria-disabled]="isLoading() || null"
    (click)="press()"
  >
    <ng-container [ngTemplateOutlet]="label" />
  </button>
} @else {
  <button
    mat-button
    [attr.aria-label]="accessibleLabel() ?? null"
    [attr.type]="isSubmitButton() ? 'submit' : 'button'"
    [disabled]="disabled()"
    [attr.aria-busy]="isLoading() || null"
    [attr.aria-disabled]="isLoading() || null"
    (click)="press()"
  >
    <ng-container [ngTemplateOutlet]="label" />
  </button>
}
