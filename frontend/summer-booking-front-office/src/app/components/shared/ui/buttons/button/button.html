<!-- While loading the label stays (it keeps the size and the name of the button) but cannot be seen:
the spinner is drawn over it. -->
<ng-template #label>
  <span class="button__label" [class.button__label__hidden]="loading()"><ng-content /></span>
  @if (loading()) {
    <mat-progress-spinner
      class="button__spinner"
      mode="indeterminate"
      aria-hidden="true"
      [diameter]="spinnerSize()"
    />
  }
</ng-template>

@if (appearance() !== 'secondary') {
  <button
    mat-flat-button
    [attr.aria-label]="accessibleLabel() ?? null"
    [attr.type]="buttonType()"
    [disabled]="disabled()"
    [attr.aria-busy]="loading() || null"
    [attr.aria-disabled]="loading() || null"
    (click)="press()"
  >
    <ng-container [ngTemplateOutlet]="label" />
  </button>
} @else {
  <button
    mat-button
    [attr.aria-label]="accessibleLabel() ?? null"
    [attr.type]="buttonType()"
    [disabled]="disabled()"
    [attr.aria-busy]="loading() || null"
    [attr.aria-disabled]="loading() || null"
    (click)="press()"
  >
    <ng-container [ngTemplateOutlet]="label" />
  </button>
}
