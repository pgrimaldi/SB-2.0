<footer class="footer">
  <div class="footer__content">
    <div class="footer__brand">
      <img
        class="footer__logo"
        src="/assets/images/hub/logo-text-blue.webp"
        width="944"
        height="342"
        loading="lazy"
        [alt]="'hub.header.logo.alt' | translate"
      />

      <ul class="footer__social">
        @for (social of socials; track social) {
          <li>
            <button
              class="footer__social__link"
              type="button"
              [attr.aria-label]="'hub.footer.social.' + social | translate"
            >
              <img
                [src]="'/assets/images/hub/footer-' + social + '.svg'"
                width="24"
                height="24"
                alt=""
              />
            </button>
          </li>
        }
      </ul>
    </div>

    @for (column of columns; track $index) {
      <ul class="footer__links">
        @for (link of column; track link.key) {
          <li [class.footer__links__highlight]="link.highlight">
            <button
              class="footer__link"
              type="button"
              [appI18nText]="'hub.footer.links.' + link.key"
            ></button>
          </li>
        }
      </ul>
    }
  </div>

  <div class="footer__bottom">
    <div class="footer__bottom__content">
      <p appI18nText="hub.footer.legal.group"></p>
      <p appI18nText="hub.footer.legal.company" [params]="year"></p>
    </div>
  </div>
</footer>
