<app-page-title
  class="table__booking__title"
  [text]="'management.settings.services.table_booking.title' | translate"
  [pathIcon]="titleIcon"
/>
<app-table
  #table
  [columns]="columns()"
  [params]="params()"
  [load]="catalog.tableServiceList"
  idField="idTableService"
  [texts]="'table' | translate"
  [isSearchable]="true"
  [useAppTheme]="false"
  [areMassiveActionsHidden]="false"
  [isCreateButtonHidden]="false"
  [createLabel]="'management.settings.services.table_booking.create' | translate"
  [rowActions]="rowActions()"
  [(selection)]="idSelectedTableServices"
  [pathIcon]="tableIcons"
  (loadError)="loadFailed.set(true)"
  (deleteSelected)="askDelete($event)"
  (duplicateSelected)="askDuplicate($event)"
  (create)="adding.set(true)"
/>

<app-table-service-add-item-panel
  [pathIcon]="closeIcon"
  [(open)]="adding"
  (created)="table.reload()"
/>

<app-delete-items-popup
  [idItems]="idTableServicesToDelete()"
  [itemName]="tableServiceNameToDelete()"
  translationKey="management.settings.services.table_booking.delete"
  [action]="deleteTableServices"
  [pathIcon]="alertIcons"
  [(open)]="deleting"
  (deleted)="forgetDeleted($event); table.reload()"
/>
<app-duplicate-items-popup
  [idItems]="idTableServicesToDuplicate()"
  [itemName]="tableServiceNameToDuplicate()"
  translationKey="management.settings.services.table_booking.duplicate"
  [action]="duplicateTableServices"
  [pathIcon]="alertIcons"
  [(open)]="duplicating"
  (duplicated)="afterDuplicate(); table.reload()"
/>

<app-table-error-popup
  [pathIcon]="closeIcon"
  [title]="'table.load_error.title' | translate"
  [text]="'table.load_error.text' | translate"
  [texts]="'table.load_error' | translate"
  [(open)]="loadFailed"
  (retry)="table.reload()"
/>
