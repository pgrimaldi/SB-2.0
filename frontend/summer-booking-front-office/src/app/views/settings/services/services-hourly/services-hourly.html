<app-page-title
  class="services__hourly__title"
  [text]="'management.settings.services.hourly_services.title' | translate"
  [pathIcon]="titleIcon"
/>
<app-table
  #table
  [columns]="columns()"
  [params]="params()"
  [load]="catalog.hourlyServiceList"
  idField="idHourlyService"
  [texts]="'table' | translate"
  [isSearchable]="true"
  [useAppTheme]="false"
  [areMassiveActionsHidden]="false"
  [isCreateButtonHidden]="false"
  [createLabel]="'management.settings.services.hourly_services.create' | translate"
  [rowActions]="rowActions()"
  [(selection)]="idSelectedHourlyServices"
  [pathIcon]="tableIcons"
  (loadError)="loadFailed.set(true)"
  (deleteSelected)="askDelete($event)"
  (duplicateSelected)="askDuplicate($event)"
  (create)="adding.set(true)"
/>

<app-hourly-service-add-item-panel
  [pathIcon]="closeIcon"
  [(open)]="adding"
  (created)="table.reload()"
/>
<app-hourly-service-edit-item-panel
  [pathIcon]="closeIcon"
  [idHourlyService]="idHourlyServiceToEdit()"
  [(open)]="editing"
  (updated)="table.reload()"
/>

<app-delete-items-popup
  [idItems]="idHourlyServicesToDelete()"
  [itemName]="hourlyServiceNameToDelete()"
  translationKey="management.settings.services.hourly_services.delete"
  [action]="deleteHourlyServices"
  [pathIcon]="alertIcons"
  [(open)]="deleting"
  (deleted)="forgetDeleted($event); table.reload()"
/>
<app-duplicate-items-popup
  [idItems]="idHourlyServicesToDuplicate()"
  [itemName]="hourlyServiceNameToDuplicate()"
  translationKey="management.settings.services.hourly_services.duplicate"
  [action]="duplicateHourlyServices"
  [pathIcon]="alertIcons"
  [(open)]="duplicating"
  (duplicated)="afterDuplicate(); table.reload()"
/>

<app-table-error-popup
  [pathIcon]="closeIcon"
  [title]="'table.load_error.title' | translate"
  [text]="'table.load_error.text' | translate"
  [texts]="'table.load_error' | translate"
  [(open)]="loadFailed"
  (retry)="table.reload()"
/>
