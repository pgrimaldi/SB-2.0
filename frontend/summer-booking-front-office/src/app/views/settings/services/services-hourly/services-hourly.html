<app-page-title
  class="services__hourly__title"
  [text]="'management.settings.services.hourly_services.title' | translate"
  [pathIcon]="titleIcon"
/>
<app-table
  #table
  [columns]="columns()"
  [params]="params()"
  [load]="catalog.hourlyServiceList"
  idField="idHourlyService"
  [texts]="'table' | translate"
  [isSearchable]="true"
  [useAppTheme]="false"
  [areMassiveActionsHidden]="false"
  [isCreateButtonHidden]="false"
  [createLabel]="'management.settings.services.hourly_services.create' | translate"
  [rowActions]="rowActions()"
  [pathIcon]="tableIcons"
  (loadError)="loadFailed.set(true)"
/>

<app-table-error-popup
  [pathIcon]="closeIcon"
  [title]="'table.load_error.title' | translate"
  [text]="'table.load_error.text' | translate"
  [texts]="'table.load_error' | translate"
  [(open)]="loadFailed"
  (retry)="table.reload()"
/>
