<app-page-title
  class="services__bar__title"
  [text]="'management.settings.services.bar_services.title' | translate"
  [pathIcon]="titleIcon"
/>
<app-table
  #table
  [columns]="columns()"
  [params]="params()"
  [load]="load"
  idField="idBarService"
  [texts]="'table' | translate"
  [isSearchable]="true"
  [useAppTheme]="false"
  [areMassiveActionsHidden]="false"
  [isCreateButtonHidden]="false"
  [createLabel]="'management.settings.services.bar_services.create' | translate"
  [rowActions]="rowActions()"
  [(selection)]="idSelectedBarServices"
  [pathIcon]="tableIcons"
  (loadError)="loadFailed.set(true)"
  (deleteSelected)="askDelete($event)"
  (duplicateSelected)="askDuplicate($event)"
  (create)="adding.set(true)"
/>

<app-bar-service-add-item-panel [pathIcon]="closeIcon" [(open)]="adding" />

<app-delete-items-popup
  [idItems]="idBarServicesToDelete()"
  [itemName]="barServiceNameToDelete()"
  translationKey="management.settings.services.bar_services.delete"
  [action]="deleteBarServices"
  [pathIcon]="alertIcons"
  [(open)]="deleting"
  (deleted)="forgetDeleted($event); table.reload()"
/>
<app-duplicate-items-popup
  [idItems]="idBarServicesToDuplicate()"
  [itemName]="barServiceNameToDuplicate()"
  translationKey="management.settings.services.bar_services.duplicate"
  [action]="duplicateBarServices"
  [pathIcon]="alertIcons"
  [(open)]="duplicating"
  (duplicated)="afterDuplicate(); table.reload()"
/>

<app-table-error-popup
  [pathIcon]="closeIcon"
  [title]="'table.load_error.title' | translate"
  [text]="'table.load_error.text' | translate"
  [texts]="'table.load_error' | translate"
  [(open)]="loadFailed"
  (retry)="table.reload()"
/>
