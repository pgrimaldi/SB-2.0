<app-page-title
  class="automatic__prices__title"
  [text]="'management.settings.services.automatic_prices.title' | translate"
  [pathIcon]="titleIcon"
/>
<app-table
  #table
  [columns]="columns()"
  [params]="params()"
  [load]="load"
  idField="idAutomaticPrice"
  [texts]="'table' | translate"
  [isSearchable]="true"
  [useAppTheme]="false"
  [areMassiveActionsHidden]="false"
  [isCreateButtonHidden]="false"
  [createLabel]="'management.settings.services.automatic_prices.create' | translate"
  [rowActions]="rowActions()"
  [(selection)]="idSelectedAutomaticPrices"
  [pathIcon]="tableIcons"
  (loadError)="loadFailed.set(true)"
  (deleteSelected)="askDelete($event)"
  (duplicateSelected)="askDuplicate($event)"
  (create)="adding.set(true)"
/>

<app-automatic-price-add-item-panel
  [pathIcon]="closeIcon"
  [(open)]="adding"
  (created)="table.reload()"
/>

<app-delete-items-popup
  [idItems]="idAutomaticPricesToDelete()"
  [itemName]="automaticPriceNameToDelete()"
  translationKey="management.settings.services.automatic_prices.delete"
  [action]="deleteAutomaticPrices"
  [pathIcon]="alertIcons"
  [(open)]="deleting"
  (deleted)="forgetDeleted($event); table.reload()"
/>
<app-duplicate-items-popup
  [idItems]="idAutomaticPricesToDuplicate()"
  [itemName]="automaticPriceNameToDuplicate()"
  translationKey="management.settings.services.automatic_prices.duplicate"
  [action]="duplicateAutomaticPrices"
  [pathIcon]="alertIcons"
  [(open)]="duplicating"
  (duplicated)="afterDuplicate(); table.reload()"
/>

<app-table-error-popup
  [pathIcon]="closeIcon"
  [title]="'table.load_error.title' | translate"
  [text]="'table.load_error.text' | translate"
  [texts]="'table.load_error' | translate"
  [(open)]="loadFailed"
  (retry)="table.reload()"
/>
