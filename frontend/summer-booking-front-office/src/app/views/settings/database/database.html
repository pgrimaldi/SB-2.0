<main class="database">
  <div class="database__title">
    <h1 class="database__heading">{{ 'management.settings.database.title' | translate }}</h1>
    <app-button class="database__trash" [size]="ButtonSize.Small" [pathIcon]="trashIcon">
      {{ 'management.settings.database.trash' | translate }}
    </app-button>
  </div>
  <app-table
    #table
    [columns]="columns()"
    [params]="params()"
    [filters]="filters()"
    [load]="load"
    idField="idBooking"
    [texts]="'table' | translate"
    [isSearchable]="true"
    [areMassiveActionsHidden]="true"
    [isSelectable]="true"
    [(selection)]="idSelectedBookings"
    [isCreateButtonHidden]="true"
    [pathIcon]="tableIcons"
    (loadError)="loadFailed.set(true)"
  >
    <app-date-range-select
      appTableHeadingAction
      [options]="dateOptions()"
      [(range)]="dateRange"
      [texts]="'management.settings.database.date_filter' | translate"
      [pathIcon]="dateFilterIcons"
    />
    <button
      appTableHeadingAction
      class="database__filters"
      type="button"
      (click)="isFiltersOpen.set(true)"
    >
      {{ 'management.settings.database.filters.button' | translate }}
      @if (chips().length) {
        <span class="database__filters__count">{{ chips().length }}</span>
      }
    </button>
    <app-button
      appTableHeadingAction
      class="database__clear__selection"
      [appearance]="ButtonAppearance.Light"
      [size]="ButtonSize.Small"
      [disabled]="!idSelectedBookings().length"
      (clicked)="idSelectedBookings.set([])"
    >
      {{ 'management.settings.database.clear_selection' | translate }}
    </app-button>
    <app-button
      appTableHeadingAction
      class="database__delete"
      [size]="ButtonSize.Small"
      [disabled]="!idSelectedBookings().length"
    >
      {{ 'management.settings.database.delete' | translate }}
    </app-button>
    @if (chips().length) {
      <app-filter-chips
        appTableFilterBar
        [chips]="chips()"
        [texts]="{ clear: 'management.settings.database.filters.chips.clear' | translate }"
        [pathIcon]="chipIcons"
        (removed)="removeChip($event)"
        (cleared)="clearFilters(); table.clearSearch()"
      />
    }
  </app-table>
</main>

<app-existing-booking-filters-popup
  [filters]="bookingFilters()"
  [(open)]="isFiltersOpen"
  (applied)="bookingFilters.set($event)"
/>

<app-table-error-popup
  [title]="'table.load_error.title' | translate"
  [text]="'table.load_error.text' | translate"
  [texts]="'table.load_error' | translate"
  [(open)]="loadFailed"
  (retry)="table.reload()"
/>
