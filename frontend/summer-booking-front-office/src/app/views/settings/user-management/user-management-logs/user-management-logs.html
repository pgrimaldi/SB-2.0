<main class="user__management__logs">
  <div class="user__management__logs__title">
    <a class="user__management__logs__back" routerLink="/settings/user-management">
      <img [src]="backIcon" width="10" height="16" alt="" />
    </a>
    <h1 class="user__management__logs__heading">
      <img class="user__management__logs__icon" [src]="titleIcon" width="15" height="18" alt="" />
      {{ 'management.settings.user_management.logs.title' | translate }}
    </h1>
  </div>
  <app-table
    #table
    [columns]="columns()"
    [params]="params()"
    [filters]="filters()"
    [load]="load"
    idField="idAuditEntry"
    [texts]="'table' | translate"
    [isSearchable]="true"
    [areMassiveActionsHidden]="true"
    [isCreateButtonHidden]="true"
    [pathIcon]="tableIcons"
    (loadError)="loadFailed.set(true)"
  >
    <app-date-range-select
      appTableHeadingAction
      [options]="dateOptions()"
      [(range)]="dateRange"
      [texts]="'management.settings.user_management.logs.date_filter' | translate"
      [pathIcon]="dateFilterIcons"
    />
    <button
      appTableHeadingAction
      class="user__management__logs__filters"
      type="button"
      (click)="isFiltersOpen.set(true)"
    >
      {{ 'management.settings.user_management.logs.filters' | translate }}
      @if (chips().length) {
        <span class="user__management__logs__filters__count">{{ chips().length }}</span>
      }
    </button>
    <app-button
      appTableHeadingAction
      class="user__management__logs__export"
      [appearance]="ButtonAppearance.Light"
      [size]="ButtonSize.Small"
      [disabled]="isPrinting()"
      [isLoading]="isExporting()"
      (clicked)="exportLog()"
    >
      {{ 'management.settings.user_management.logs.export' | translate }}
    </app-button>
    <app-button
      appTableHeadingAction
      class="user__management__logs__print"
      [appearance]="ButtonAppearance.Light"
      [size]="ButtonSize.Small"
      [disabled]="isExporting()"
      [isLoading]="isPrinting()"
      (clicked)="printLog()"
    >
      {{ 'management.settings.user_management.logs.print' | translate }}
    </app-button>
    @if (hasFilters()) {
      <app-filter-chips
        appTableFilterBar
        [chips]="chips()"
        [texts]="{ clear: 'management.settings.user_management.logs.clear_filters' | translate }"
        [pathIcon]="chipIcons"
        (removed)="removeChip($event)"
        (cleared)="clearFilters()"
      />
    }
  </app-table>
</main>

<app-audit-log-filters-popup
  [pathIcon]="closeIcon"
  [filters]="logFilters()"
  [onlyUsers]="onlyUsers()"
  [(open)]="isFiltersOpen"
  (applied)="applyFilters($event)"
/>

<app-alert-popup
  [title]="'alert.error_title' | translate"
  [text]="'management.settings.user_management.logs.not_implemented' | translate"
  [texts]="'alert' | translate"
  [pathIcon]="alertIcons"
  [(open)]="isNotImplementedShown"
/>

<app-table-error-popup
  [pathIcon]="closeIcon"
  [title]="'table.load_error.title' | translate"
  [text]="'table.load_error.text' | translate"
  [texts]="'table.load_error' | translate"
  [(open)]="loadFailed"
  (retry)="table.reload()"
/>
