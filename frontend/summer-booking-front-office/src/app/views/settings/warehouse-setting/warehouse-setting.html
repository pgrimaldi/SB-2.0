<main class="warehouse__setting">
  <app-page-title
    class="warehouse__setting__title"
    [text]="'management.settings.warehouse.title' | translate"
    [pathIcon]="titleIcon"
  />
  <app-table
    #table
    [columns]="columns()"
    [params]="filters.request()"
    [load]="warehouse.list"
    idField="idArticle"
    [texts]="'table' | translate"
    [isSearchable]="true"
    [useAppTheme]="false"
    [areMassiveActionsHidden]="false"
    [isCreateButtonHidden]="false"
    [createLabel]="'management.settings.warehouse.create' | translate"
    [rowActions]="rowActions()"
    [(selection)]="idSelectedItems"
    [pathIcon]="tableIcons"
    (loadError)="loadFailed.set(true)"
    (create)="adding.set(true)"
    (deleteSelected)="askDelete($event)"
    (duplicateSelected)="askDuplicate($event)"
  />
</main>

<app-form-warehouse-add-item-popup [(open)]="adding" (added)="table.reload()" />
<app-form-warehouse-edit-item-popup
  [item]="editedItem()"
  [(open)]="editing"
  (saved)="table.reload()"
/>
<app-delete-warehouse-items-popup
  [idItems]="idItemsToDelete()"
  [itemName]="itemNameToDelete()"
  [(open)]="deleting"
  (deleted)="forgetDeleted($event); table.reload()"
/>
<app-duplicate-warehouse-items-popup
  [idItems]="idItemsToDuplicate()"
  [itemName]="itemNameToDuplicate()"
  [(open)]="duplicating"
  (duplicated)="afterDuplicate(); table.reload()"
/>

<app-table-error-popup
  [title]="'table.load_error.title' | translate"
  [text]="'table.load_error.text' | translate"
  [texts]="'table.load_error' | translate"
  [(open)]="loadFailed"
  (retry)="table.reload()"
/>
