<main class="vouchers">
  <app-page-title
    class="vouchers__title"
    [text]="'management.settings.vouchers.title' | translate"
    [pathIcon]="titleIcon"
  />
  <app-table
    #table
    [columns]="columns()"
    [params]="params()"
    [load]="load"
    idField="idVoucher"
    [texts]="'table' | translate"
    [useAppTheme]="false"
    [areMassiveActionsHidden]="false"
    [isCreateButtonHidden]="false"
    [createLabel]="'management.settings.vouchers.create' | translate"
    [rowActions]="rowActions()"
    [(selection)]="idSelectedVouchers"
    [pathIcon]="tableIcons"
    (loadError)="loadFailed.set(true)"
    (deleteSelected)="askDelete($event)"
    (duplicateSelected)="askDuplicate($event)"
    (create)="adding.set(true)"
  />
</main>

<app-voucher-add-item-panel [pathIcon]="closeIcon" [(open)]="adding" (added)="table.reload()" />
<app-voucher-edit-item-panel
  [pathIcon]="closeIcon"
  [idVoucher]="idVoucherToEdit()"
  [(open)]="editing"
  (updated)="table.reload()"
/>

<app-delete-items-popup
  [idItems]="idVouchersToDelete()"
  [itemName]="voucherNameToDelete()"
  translationKey="management.settings.vouchers.delete"
  [action]="deleteVouchers"
  [pathIcon]="alertIcons"
  [(open)]="deleting"
  (deleted)="forgetDeleted($event); table.reload()"
/>
<app-duplicate-items-popup
  [idItems]="idVouchersToDuplicate()"
  [itemName]="voucherNameToDuplicate()"
  translationKey="management.settings.vouchers.duplicate"
  [action]="duplicateVouchers"
  [pathIcon]="alertIcons"
  [(open)]="duplicating"
  (duplicated)="afterDuplicate(); table.reload()"
/>

<app-table-error-popup
  [pathIcon]="closeIcon"
  [title]="'table.load_error.title' | translate"
  [text]="'table.load_error.text' | translate"
  [texts]="'table.load_error' | translate"
  [(open)]="loadFailed"
  (retry)="table.reload()"
/>
