<main class="sharing">
  <section class="sharing__panel">
    <app-section-title [text]="'management.settings.sharing.title' | translate" />
    <app-toggle [formField]="informationForm.isEnabled" [error]="fieldErrors.isEnabled()">
      <span appI18nText="management.settings.sharing.enabled"></span>
    </app-toggle>
    <div class="sharing__row">
      <app-toggle
        [formField]="informationForm.isMinBookingDaysEnabled"
        [error]="fieldErrors.isMinBookingDaysEnabled()"
      >
        <span appI18nText="management.settings.sharing.minimum_booking_days"></span>
      </app-toggle>
      <div class="sharing__amount">
        <app-filled-number-field
          class="sharing__field"
          [formField]="informationForm.minBookingDays"
          [error]="fieldErrors.minBookingDays()"
        />
        <span class="sharing__unit" appI18nText="management.settings.sharing.days"></span>
      </div>
    </div>
    <app-toggle [formField]="informationForm.seasonalOnly" [error]="fieldErrors.seasonalOnly()">
      <span appI18nText="management.settings.sharing.only_seasonal"></span>
    </app-toggle>
    <app-toggle [formField]="informationForm.allArticles" [error]="fieldErrors.allArticles()">
      <span appI18nText="management.settings.sharing.all_articles"></span>
    </app-toggle>
    <app-toggle
      [formField]="informationForm.absencesAsSharing"
      [error]="fieldErrors.absencesAsSharing()"
    >
      <span appI18nText="management.settings.sharing.scheduled_absences"></span>
    </app-toggle>
  </section>

  <section class="sharing__panel">
    <app-section-title [text]="'management.settings.sharing.credits.title' | translate" />
    <div class="sharing__credits">
      <div class="sharing__credit__option">
        <app-checkbox
          [formField]="informationForm.manualCreditEnabled"
          [error]="fieldErrors.manualCreditEnabled()"
        >
          <span
            class="sharing__credit__name"
            appI18nText="management.settings.sharing.credits.manual"
          ></span>
        </app-checkbox>
      </div>
      <span
        class="sharing__credit__label"
        appI18nText="management.settings.sharing.credits.resold_day_credits"
      ></span>
      <app-filled-number-field
        class="sharing__field"
        [formField]="informationForm.manualCreditUnitsPerDay"
        [error]="fieldErrors.manualCreditUnitsPerDay()"
      />
      <span
        class="sharing__credit__label sharing__credit__label__end"
        appI18nText="management.settings.sharing.credits.credit_value"
      ></span>
      <app-filled-number-field
        class="sharing__field"
        [isDecimal]="true"
        [isCurrency]="true"
        [formField]="informationForm.manualCreditAmount"
        [error]="fieldErrors.manualCreditAmount()"
      />
      <span class="sharing__unit">€</span>

      <div class="sharing__credit__option">
        <app-checkbox
          [formField]="informationForm.voucherCreditEnabled"
          [error]="fieldErrors.voucherCreditEnabled()"
        >
          <span
            class="sharing__credit__name"
            appI18nText="management.settings.sharing.credits.automatic_voucher"
          ></span>
        </app-checkbox>
        <p
          class="sharing__credit__description"
          appI18nText="management.settings.sharing.credits.automatic_voucher_description"
        ></p>
      </div>
      <span
        class="sharing__credit__label"
        appI18nText="management.settings.sharing.credits.credit_value"
      ></span>
      <app-filled-number-field
        class="sharing__field"
        [isDecimal]="true"
        [isCurrency]="true"
        [formField]="informationForm.voucherCreditAmount"
        [error]="fieldErrors.voucherCreditAmount()"
      />
      <span class="sharing__unit">€</span>

      <div class="sharing__credit__option">
        <app-checkbox
          [formField]="informationForm.cardTopUpEnabled"
          [error]="fieldErrors.cardTopUpEnabled()"
        >
          <span
            class="sharing__credit__name"
            appI18nText="management.settings.sharing.credits.prepaid_card"
          ></span>
        </app-checkbox>
        <p
          class="sharing__credit__description"
          appI18nText="management.settings.sharing.credits.prepaid_card_description"
        ></p>
      </div>
      <span
        class="sharing__credit__label"
        appI18nText="management.settings.sharing.credits.credit_value"
      ></span>
      <app-filled-number-field
        class="sharing__field"
        [isDecimal]="true"
        [isCurrency]="true"
        [formField]="informationForm.cardTopUpAmount"
        [error]="fieldErrors.cardTopUpAmount()"
      />
      <span class="sharing__unit">€</span>
    </div>
  </section>

  @if (errorMessage(); as errorMessage) {
    <div class="sharing__failure">
      <p class="sharing__error">{{ errorMessage }}</p>
      @if (!loaded()) {
        <app-button [size]="ButtonSize.Small" (clicked)="reload()">
          <span appI18nText="table.load_error.retry"></span>
        </app-button>
      }
    </div>
  }
  <div class="sharing__actions">
    <app-button
      [size]="ButtonSize.Small"
      [isFullWidth]="true"
      [disabled]="(!canSave() && !isSaving()) || informationForm().invalid()"
      [isLoading]="isSaving()"
      (clicked)="save()"
    >
      <span appI18nText="management.settings.sharing.save"></span>
    </app-button>
  </div>
</main>

<app-message-popup
  [pathIcon]="closeIcon"
  [title]="'management.settings.sharing.saved.title' | translate"
  [text]="'management.settings.sharing.saved.text' | translate"
  [texts]="'management.settings.sharing.saved' | translate"
  [(open)]="saved"
/>
<app-version-conflict-popup [pathIcon]="closeIcon" [(open)]="isConflictShown" />
