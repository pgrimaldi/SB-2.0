<main class="email__configuration">
  <section class="email__configuration__panel email__configuration__override">
    <p
      class="email__configuration__question"
      appI18nText="management.settings.email_configuration.override.question"
    ></p>
    <app-button
      [size]="ButtonSize.Small"
      [isFullWidth]="true"
      [disabled]="!canOverride()"
      (clicked)="editable.set(true)"
    >
      <span appI18nText="management.settings.email_configuration.override.confirm"></span>
    </app-button>
  </section>

  <section class="email__configuration__panel">
    @for (field of maskedFields; track field.name) {
      <div class="email__configuration__row">
        <div>
          <p
            class="email__configuration__title"
            [appI18nText]="'management.settings.email_configuration.fields.' + field.key + '.title'"
          ></p>
          <p
            class="email__configuration__description"
            [appI18nText]="
              'management.settings.email_configuration.fields.' + field.key + '.description'
            "
          ></p>
        </div>
        <!-- new-password: the browser must not fill in the saved sign-in of the user here. -->
        @if (field.name === 'smtpPort') {
          <app-filled-number-field
            autocomplete="new-password"
            [isMasked]="true"
            [pathIcon]="portIcons"
            [error]="fieldErrors.smtpPort()"
            [formField]="configurationForm.smtpPort"
          />
        } @else {
          <app-filled-text-field
            [isPasswordField]="true"
            autocomplete="new-password"
            [pathIcon]="eyeIcons"
            [placeholder]="
              field.name === 'smtpPassword'
                ? ((passwordSaved()
                    ? 'management.settings.email_configuration.fields.smtp_password.saved'
                    : 'management.settings.email_configuration.fields.smtp_password.missing'
                  ) | translate)
                : ''
            "
            [error]="fieldErrors[field.name]()"
            [formField]="configurationForm[field.name]"
          />
        }
      </div>
    }
    <div class="email__configuration__row">
      <div>
        <p
          class="email__configuration__title"
          appI18nText="management.settings.email_configuration.fields.smtp_security.title"
        ></p>
        <p
          class="email__configuration__description"
          appI18nText="management.settings.email_configuration.fields.smtp_security.description"
        ></p>
      </div>
      <app-filled-select
        [options]="securityOptions()"
        [error]="fieldErrors.smtpSecurity()"
        [formField]="configurationForm.smtpSecurity"
      />
    </div>
  </section>

  @if (errorMessage(); as errorMessage) {
    <p class="email__configuration__error">{{ errorMessage }}</p>
  }
  <div class="email__configuration__actions">
    <app-button
      [size]="ButtonSize.Small"
      [isFullWidth]="true"
      [pathIcon]="sendTestIcon"
      [disabled]="isBusy() && !isSendingTest()"
      [isLoading]="isSendingTest()"
      (clicked)="sendTestEmail()"
    >
      <span appI18nText="management.settings.email_configuration.send_test"></span>
    </app-button>
    <app-button
      [size]="ButtonSize.Small"
      [isFullWidth]="true"
      [pathIcon]="resetIcon"
      [disabled]="isBusy() && !isReloading()"
      [isLoading]="isReloading()"
      (clicked)="reset()"
    >
      <span appI18nText="management.settings.email_configuration.reset"></span>
    </app-button>
    <app-button
      [size]="ButtonSize.Small"
      [isFullWidth]="true"
      [disabled]="(isBusy() && !isSaving()) || configurationForm().invalid()"
      [isLoading]="isSaving()"
      (clicked)="save()"
    >
      <span appI18nText="management.settings.email_configuration.save"></span>
    </app-button>
  </div>
</main>

<app-message-popup
  [title]="'management.settings.email_configuration.test_sent.title' | translate"
  [text]="'management.settings.email_configuration.test_sent.text' | translate"
  [texts]="'management.settings.email_configuration.test_sent' | translate"
  [(open)]="testSent"
/>
<app-message-popup
  [title]="'management.settings.email_configuration.saved.title' | translate"
  [text]="'management.settings.email_configuration.saved.text' | translate"
  [texts]="'management.settings.email_configuration.saved' | translate"
  [(open)]="saved"
/>
