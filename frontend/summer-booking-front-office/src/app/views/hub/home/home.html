<app-header />

<main class="home__page" appEqualHeight="app-card">
  <section class="home__hero">
    <picture class="home__hero__media">
      <source
        media="(width < 64rem) and (orientation: portrait)"
        srcset="
          /assets/images/hub/hero-beach-mobile-863.webp   863w,
          /assets/images/hub/hero-beach-mobile-1290.webp 1290w
        "
        sizes="100vw"
      />
      <img
        src="/assets/images/hub/hero-beach-1920.webp"
        srcset="
          /assets/images/hub/hero-beach-1920.webp 1920w,
          /assets/images/hub/hero-beach-3840.webp 3840w
        "
        sizes="100vw"
        width="1920"
        height="1080"
        fetchpriority="high"
        decoding="async"
        [alt]="'home.hero.image.alt' | translate"
      />
    </picture>

    <div class="home__hero__content">
      <h1 appI18nText="home.hero.title"></h1>
      <p appI18nText="home.hero.description"></p>
    </div>
  </section>

  <section class="home__information">
    <div class="home__information__content">
      <div class="home__information__header">
        <h2 appI18nText="home.management.title"></h2>
        <p appI18nText="home.management.description"></p>
      </div>

      <div class="home__information__cards">
        @for (card of managementCards; track card.key) {
          <app-card [pathIcon]="['/assets/images/hub/' + card.icon + '.webp']">
            <span cardHeading [appI18nText]="'home.management.cards.' + card.key + '.title'"></span>
            <p [appI18nText]="'home.management.cards.' + card.key + '.intro'"></p>
            <p [appI18nText]="'home.management.cards.' + card.key + '.detail'"></p>
          </app-card>
        }
      </div>
    </div>
  </section>

  <section class="home__intermezzo">
    <div class="home__intermezzo__panel">
      <div class="home__intermezzo__content">
        <div class="home__booster__text">
          <h2 appI18nText="home.booster.title"></h2>
          <div class="home__booster__description">
            <p appI18nText="home.booster.channels"></p>
            <p appI18nText="home.booster.offers"></p>
          </div>
          <app-button
            class="home__booster__action home__action__desktop"
            [appearance]="ButtonAppearance.Light"
            [size]="ButtonSize.Small"
          >
            <span appI18nText="home.booster.action"></span>
          </app-button>
          <app-button
            class="home__booster__action home__action__mobile"
            [appearance]="ButtonAppearance.Light"
            [size]="ButtonSize.ExtraLarge"
            [isFullWidth]="true"
          >
            <span appI18nText="home.booster.action"></span>
          </app-button>
        </div>

        <div class="home__booster__media">
          <img
            class="home__booster__image"
            src="/assets/images/hub/app-mockup-1080.webp"
            srcset="
              /assets/images/hub/app-mockup-640.webp   640w,
              /assets/images/hub/app-mockup-1080.webp 1080w,
              /assets/images/hub/app-mockup-1692.webp 1692w
            "
            sizes="(width < 64rem) 17.4rem, max(21.7rem, 18.1vw)"
            width="1692"
            height="1560"
            loading="lazy"
            decoding="async"
            [alt]="'home.booster.image.alt' | translate"
          />
        </div>
      </div>
    </div>
  </section>

  <section class="home__information">
    <div class="home__information__content">
      <div class="home__information__header">
        <h2 appI18nText="home.shift.title"></h2>
      </div>

      <div class="home__information__cards">
        @for (card of shiftCards; track card.key) {
          <app-card [pathIcon]="['/assets/images/hub/' + card.icon + '.svg']">
            <span cardHeading [appI18nText]="'home.shift.cards.' + card.key + '.title'"></span>
            <p [appI18nText]="'home.shift.cards.' + card.key + '.intro'"></p>
            <p
              class="home__information__detail"
              [appI18nText]="'home.shift.cards.' + card.key + '.detail'"
            ></p>
          </app-card>
        }
      </div>
    </div>
  </section>

  <section class="home__intermezzo home__growth">
    <div class="home__intermezzo__panel">
      <div class="home__intermezzo__content">
        <h2 appI18nText="home.growth.title"></h2>

        <div class="home__growth__actions">
          <app-button class="home__action__desktop" [size]="ButtonSize.Medium">
            <span appI18nText="home.growth.action"></span>
          </app-button>
          <app-button
            class="home__action__mobile"
            [size]="ButtonSize.ExtraLarge"
            [isFullWidth]="true"
          >
            <span appI18nText="home.growth.action"></span>
          </app-button>
        </div>
      </div>
    </div>
  </section>

  <section
    id="about-us"
    class="home__information home__about__us"
  >
    <div class="home__information__content">
      <div class="home__information__header">
        <h2 appI18nText="home.about_us.title"></h2>
      </div>

      <app-carousel
        class="home__information__carousel"
        [pathIcon]="['/assets/images/chevron-left.svg', '/assets/images/chevron-right.svg']"
      >
        @for (review of aboutUsReviews; track review.key) {
          <app-card *appCarouselSlide [pathIcon]="['/assets/images/hub/' + review.icon + '.svg']">
            <span
              cardHeading
              [appI18nText]="'home.about_us.reviews.' + review.key + '.author'"
            ></span>
            <p
              class="home__about__us__quote"
              [appI18nText]="'home.about_us.reviews.' + review.key + '.quote'"
              [isHtml]="true"
            ></p>
          </app-card>
        }
      </app-carousel>
    </div>
  </section>

  <section id="media" class="home__information">
    <div class="home__information__content">
      <div class="home__information__header">
        <h2 appI18nText="home.media.title"></h2>
      </div>

      <app-carousel
        class="home__information__carousel"
        [pathIcon]="['/assets/images/chevron-left.svg', '/assets/images/chevron-right.svg']"
      >
        @for (outlet of mediaOutlets; track outlet.logo) {
          <app-card-logo
            *appCarouselSlide
            [logoSrc]="'/assets/images/hub/media-' + outlet.logo + '.webp'"
            [logoAlt]="'home.media.logo' | translate: { name: outlet.name }"
          />
        }
      </app-carousel>
    </div>
  </section>
</main>

<app-footer />
