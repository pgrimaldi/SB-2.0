<app-hub-header />

<main class="home__page" appEqualHeight="app-card-hub">
  <section class="hero" aria-labelledby="home-hero-title">
    <picture class="hero__media">
      <source
        media="(width < 64rem) and (orientation: portrait)"
        srcset="
          /assets/images/hub/hero-beach-mobile-863.webp   863w,
          /assets/images/hub/hero-beach-mobile-1290.webp 1290w
        "
        sizes="100vw"
      />
      <img
        src="/assets/images/hub/hero-beach-1920.webp"
        srcset="
          /assets/images/hub/hero-beach-1920.webp 1920w,
          /assets/images/hub/hero-beach-3840.webp 3840w
        "
        sizes="100vw"
        width="1920"
        height="1080"
        fetchpriority="high"
        decoding="async"
        [alt]="'home.hero.image.alt' | translate"
      />
    </picture>

    <div class="hero__content">
      <h1 id="home-hero-title" appI18nText="home.hero.title"></h1>
      <p appI18nText="home.hero.description"></p>
    </div>
  </section>

  <section class="home__information" aria-labelledby="home-management-title">
    <div class="home__information__content">
      <div class="home__information__header">
        <h2 id="home-management-title" appI18nText="home.management.title"></h2>
        <p appI18nText="home.management.description"></p>
      </div>

      <div class="home__information__cards">
        @for (card of managementCards; track card.key) {
          <app-card-hub [iconSrc]="'/assets/images/hub/' + card.icon + '.png'">
            <span
              cardHubHeading
              [appI18nText]="'home.management.cards.' + card.key + '.title'"
            ></span>
            <p [appI18nText]="'home.management.cards.' + card.key + '.intro'"></p>
            <p [appI18nText]="'home.management.cards.' + card.key + '.detail'"></p>
          </app-card-hub>
        }
      </div>
    </div>
  </section>

  <section class="home__intermezzo" aria-labelledby="home-booster-title">
    <div class="home__intermezzo__panel">
      <div class="home__intermezzo__content">
        <div class="booster__text">
          <h2 id="home-booster-title" appI18nText="home.booster.title"></h2>
          <div class="booster__description">
            <p appI18nText="home.booster.channels"></p>
            <p appI18nText="home.booster.offers"></p>
          </div>
          <app-button class="booster__action home__action__desktop" appearance="light" size="small">
            <span appI18nText="home.booster.action"></span>
          </app-button>
          <app-button
            class="booster__action home__action__mobile"
            appearance="light"
            size="large"
            [fullWidth]="true"
          >
            <span appI18nText="home.booster.action"></span>
          </app-button>
        </div>

        <div class="booster__media">
          <img
            class="booster__image"
            src="/assets/images/hub/app-mockup.webp"
            width="1692"
            height="1560"
            loading="lazy"
            decoding="async"
            [alt]="'home.booster.image.alt' | translate"
          />
        </div>
      </div>
    </div>
  </section>

  <section class="home__information" aria-labelledby="home-shift-title">
    <div class="home__information__content">
      <div class="home__information__header">
        <h2 id="home-shift-title" appI18nText="home.shift.title"></h2>
      </div>

      <div class="home__information__cards">
        @for (card of shiftCards; track card.key) {
          <app-card-hub [iconSrc]="'/assets/images/hub/' + card.icon + '.svg'">
            <span cardHubHeading [appI18nText]="'home.shift.cards.' + card.key + '.title'"></span>
            <p [appI18nText]="'home.shift.cards.' + card.key + '.intro'"></p>
            <p
              class="home__information__detail"
              [appI18nText]="'home.shift.cards.' + card.key + '.detail'"
            ></p>
          </app-card-hub>
        }
      </div>
    </div>
  </section>

  <section class="home__intermezzo growth" aria-labelledby="home-growth-title">
    <div class="home__intermezzo__panel">
      <div class="home__intermezzo__content">
        <h2 id="home-growth-title" appI18nText="home.growth.title"></h2>

        <div class="growth__actions">
          <app-button class="home__action__desktop" size="medium">
            <span appI18nText="home.growth.action"></span>
          </app-button>
          <app-button class="home__action__mobile" size="large" [fullWidth]="true">
            <span appI18nText="home.growth.action"></span>
          </app-button>
        </div>
      </div>
    </div>
  </section>

  <section id="about-us" class="home__information about__us" aria-labelledby="home-about-us-title">
    <div class="home__information__content">
      <div class="home__information__header">
        <h2 id="home-about-us-title" appI18nText="home.about-us.title"></h2>
      </div>

      <app-carousel
        class="home__information__carousel"
        [accessibleLabel]="'home.about-us.carousel' | translate"
      >
        @for (review of aboutUsReviews; track review.key) {
          <app-card-hub *appCarouselSlide [iconSrc]="'/assets/images/hub/' + review.icon + '.svg'">
            <span
              cardHubHeading
              [appI18nText]="'home.about-us.reviews.' + review.key + '.author'"
            ></span>
            <p
              class="about__us__quote"
              [appI18nText]="'home.about-us.reviews.' + review.key + '.quote'"
              [html]="true"
            ></p>
          </app-card-hub>
        }
      </app-carousel>
    </div>
  </section>

  <section id="media" class="home__information" aria-labelledby="home-media-title">
    <div class="home__information__content">
      <div class="home__information__header">
        <h2 id="home-media-title" appI18nText="home.media.title"></h2>
      </div>

      <app-carousel
        class="home__information__carousel"
        [accessibleLabel]="'home.media.carousel' | translate"
      >
        @for (outlet of mediaOutlets; track outlet.logo) {
          <app-card-logo
            *appCarouselSlide
            [logoSrc]="'/assets/images/hub/media-' + outlet.logo + '.png'"
            [logoAlt]="'home.media.logo' | translate: { name: outlet.name }"
          />
        }
      </app-carousel>
    </div>
  </section>
</main>

<app-hub-footer />
