<main class="login__page">
  <nav class="language__switcher" [attr.aria-label]="'login.language.selector' | translate">
    <app-button
      appearance="secondary"
      [accessibleLabel]="'login.language.italian' | translate"
      [disabled]="currentLanguage() === 'it'"
      (clicked)="changeLanguage('it')"
    >
      IT
    </app-button>
    <app-button
      appearance="secondary"
      [accessibleLabel]="'login.language.english' | translate"
      [disabled]="currentLanguage() === 'en'"
      (clicked)="changeLanguage('en')"
    >
      EN
    </app-button>
  </nav>

  <section class="login__panel" aria-labelledby="login-title">
    <p class="product__name">{{ 'app.name' | translate }}</p>
    <h1 id="login-title">{{ 'login.title' | translate }}</h1>
    <p class="description">{{ 'login.description' | translate }}</p>
    <app-button [disabled]="true">{{ 'login.action' | translate }}</app-button>
  </section>
</main>
