<main class="login__view">
  <nav
    class="login__view__language__switcher"
    [attr.aria-label]="'login.language.selector' | translate"
  >
    <app-button
      appearance="secondary"
      [accessibleLabel]="'login.language.italian' | translate"
      [disabled]="currentLanguage() === 'it'"
      (clicked)="changeLanguage('it')"
    >
      IT
    </app-button>
    <app-button
      appearance="secondary"
      [accessibleLabel]="'login.language.english' | translate"
      [disabled]="currentLanguage() === 'en'"
      (clicked)="changeLanguage('en')"
    >
      EN
    </app-button>
  </nav>

  <section class="login__view__panel" aria-labelledby="login-title">
    <p class="login__view__product__name">{{ 'app.name' | translate }}</p>
    <h1 id="login-title">{{ 'login.title' | translate }}</h1>
    <p class="login__view__description">{{ 'login.description' | translate }}</p>
    <app-button [disabled]="true">{{ 'login.action' | translate }}</app-button>
  </section>
</main>
